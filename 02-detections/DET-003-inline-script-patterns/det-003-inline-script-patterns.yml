title: DET-003-inline-script-patterns
id: d2d7f7e0-9d0a-4d94-a2c4-9ce6e7b8d93e
status: experimental
description: Detects inline script patterns in mshta.exe command lines, including scriptlet invocation and encoded content.
author: HTA Sentinel
date: 2026-10-28
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'javascript:'
      - 'vbscript:'
      - 'script:'
      - 'about:'
      - '::'
  condition: selection
falsepositives:
  - Rare legacy support tooling or internal admin scriptlets
level: high
tags:
  - attack.execution
  - attack.t1218.005
