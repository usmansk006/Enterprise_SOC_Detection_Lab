title: DET-009-suspicious-command-line
id: f840a533-2c7a-4e5a-a5e9-c1f8aa115e28
status: experimental
description: Detects suspicious mshta.exe command lines containing encoded, indirect, or script-like execution parameters.
author: HTA Sentinel
date: 2026-10-28
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'about:'
      - 'javascript:'
      - 'vbscript:'
      - 'http://'
      - 'https://'
      - 'file://'
      - '%TEMP%'
      - 'runas'
      - 'mshtml'
  condition: selection
falsepositives:
  - Internal help tools that present localized HTA pages
level: high
tags:
  - attack.execution
  - attack.t1218.005
