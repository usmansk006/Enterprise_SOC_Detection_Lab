title: DET-002-remote-hta-reference
id: 1f6394d5-7af1-44e1-b1f0-919a30ad3b2b
status: experimental
description: Detects mshta.exe invoked with a remote or network-based HTA reference.
author: HTA Sentinel
date: 2026-10-28
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'
      - 'about:'
      - 'javascript:'
  condition: selection
falsepositives:
  - Internal web-based help portal or sanctioned browser-driven HTA wrappers
level: high
tags:
  - attack.execution
  - attack.t1218.005
