title: DET-008-related-file-creation
id: 2cc6af35-5cf4-43b2-8eb5-0f909d5d9c8d
status: experimental
description: Detects file-creation behavior associated with HTA execution, including staging files and dropped script artifacts.
author: HTA Sentinel
date: 2026-10-28
logsource:
  product: windows
  category: file_event
detection:
  selection:
    TargetFilename|contains:
      - '.hta'
      - '.js'
      - '.vbs'
      - '.bat'
      - '\Temp\'
      - '\AppData\'
  condition: selection
falsepositives:
  - Routine user document generation or internal software updates
level: medium
tags:
  - attack.persistence
  - attack.t1059
