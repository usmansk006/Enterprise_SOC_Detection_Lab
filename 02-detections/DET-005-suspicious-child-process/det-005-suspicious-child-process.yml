title: DET-005-suspicious-child-process
id: b83db62d-c2a4-48d1-8177-1f6c6b0d7fe1
status: experimental
description: Detects child processes spawned by mshta.exe that are inconsistent with a benign HTA launch pattern.
author: HTA Sentinel
date: 2026-10-28
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    ParentImage|endswith: '\mshta.exe'
    Image|endswith:
      - '\powershell.exe'
      - '\cmd.exe'
      - '\rundll32.exe'
      - '\msbuild.exe'
      - '\regsvr32.exe'
  condition: selection
falsepositives:
  - Rare enterprise help or internal support applications that intentionally chain HTA to another process
level: high
tags:
  - attack.execution
  - attack.t1059
